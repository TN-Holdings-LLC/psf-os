[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "psf-os"
version = "0.3.3"
description = "A self-checking layer between a user's circuit and an IBM heavy-hex device, without the calibration map"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["numpy", "qiskit>=2.0"]

[project.optional-dependencies]
sim = ["qiskit-aer", "qiskit-ibm-runtime"]
test = ["pytest"]
tn = ["quimb", "cotengra"]          # psf_os.exact_tn; kahypar (optional) gives better contraction orders

[project.scripts]
psf-os = "psf_os.cli:main"

[tool.setuptools.packages.find]
include = ["psf_os*"]                # vs_check/ (the workplace VS's check scripts) is not part of the package

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "slow: 20 s or more on a 2-core machine (after 2026-11-19: the full suite took 23 min, 10 of it one test); skip with -m 'not slow'",
]
