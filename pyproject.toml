[project]
name = "psf-os"
version = "0.1.0.dev0"
description = "A self-checking layer between a ring circuit and an IBM heavy-hex device, without the calibration map"
license = "AGPL-3.0-only"
requires-python = ">=3.11"
dependencies = ["numpy", "qiskit>=2.0"]

[project.optional-dependencies]
sim = ["qiskit-aer", "qiskit-ibm-runtime"]
test = ["pytest"]

[project.scripts]
psf-os = "psf_os.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
